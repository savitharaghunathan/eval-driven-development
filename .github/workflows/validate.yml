name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  structure:
    name: Skill Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check SKILL.md exists and has valid frontmatter
        run: |
          test -f define-evals/SKILL.md
          head -1 define-evals/SKILL.md | grep -q '^---$'
          grep -q '^name: define-evals$' define-evals/SKILL.md
          grep -q '^description:' define-evals/SKILL.md
          echo "SKILL.md has valid Agent Skills frontmatter"

      - name: Check reference files exist
        run: |
          test -f define-evals/references/eval-guide.md
          test -f define-evals/references/eval-taxonomy.md
          test -f define-evals/references/eval-plan-template.md
          test -f define-evals/references/sources.md
          test -f define-evals/references/example-eval-plan.md
          echo "All reference files present"

  lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Create config
        run: |
          cat > .markdownlint-cli2.yaml << 'EOF'
          config:
            MD013: false
            MD033: false
            MD041: false
          globs:
            - "define-evals/**/*.md"
          EOF

      - name: Run markdownlint
        run: markdownlint-cli2

  links:
    name: Check Links
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --timeout 30
            --retry-wait-time 5
            --max-retries 3
            --accept 200,429
            define-evals/references/sources.md
          fail: true
