name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3) — leave empty to auto-increment patch'
        required: false
        type: string
      bump:
        description: 'Auto-increment level (ignored if version is specified)'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  validate:
    name: Validate Before Release
    uses: ./.github/workflows/validate.yml

  release:
    name: Tag and Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          CURRENT=$(grep -A5 '^metadata:' define-evals/SKILL.md | grep 'version:' | sed 's/.*version: *"\(.*\)"/\1/')
          echo "Current version: $CURRENT"

          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing: $VERSION"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update SKILL.md version
        if: steps.check.outputs.exists == 'false'
        run: |
          sed -i 's/  version: ".*"/  version: "${{ steps.version.outputs.version }}"/' define-evals/SKILL.md

      - name: Commit version bump
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add define-evals/SKILL.md
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Package skill
        if: steps.check.outputs.exists == 'false'
        run: |
          zip -r define-evals-${{ steps.version.outputs.version }}.zip define-evals/
          echo "Packaged skill directory into define-evals-${{ steps.version.outputs.version }}.zip"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: define-evals-${{ steps.version.outputs.version }}.zip
